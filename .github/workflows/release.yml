# Obsidian's own updater (and BRAT) read the latest GitHub release of this repository: it must
# carry main.js, manifest.json and styles.css as plain release assets, and the tag must be the
# bare version with no "v" prefix, matching manifest.json.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match manifest.json version $manifest" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
